services:
  mysql:
    image: mysql:8.0
    container_name: asset-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: assetdashboard
      MYSQL_USER: asset
      MYSQL_PASSWORD: assetpw
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: asset-app
    stop_grace_period: 35s
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: assetdashboard
      DB_USERNAME: asset
      DB_PASSWORD: assetpw
      APP_RETENTION_AUDIT_LOG_DAYS: ${APP_RETENTION_AUDIT_LOG_DAYS:-365}
      APP_RETENTION_AGENT_TRACE_DAYS: ${APP_RETENTION_AGENT_TRACE_DAYS:-30}
      APP_RETENTION_EVALUATION_BATCH_DAYS: ${APP_RETENTION_EVALUATION_BATCH_DAYS:-90}
      APP_RESILIENCE_YAHOO_MAX_ATTEMPTS: ${APP_RESILIENCE_YAHOO_MAX_ATTEMPTS:-2}
      APP_RESILIENCE_BINANCE_MAX_ATTEMPTS: ${APP_RESILIENCE_BINANCE_MAX_ATTEMPTS:-2}
      APP_RESILIENCE_UPBIT_MAX_ATTEMPTS: ${APP_RESILIENCE_UPBIT_MAX_ATTEMPTS:-2}
      APP_RESILIENCE_GITHUB_MAX_ATTEMPTS: ${APP_RESILIENCE_GITHUB_MAX_ATTEMPTS:-3}
      TZ: Asia/Seoul

volumes:
  mysql-data:
