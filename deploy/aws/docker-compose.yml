services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    # Spring의 30초 종료 대기보다 길게 두어 Docker가 먼저 SIGKILL하지 않게 한다.
    stop_grace_period: 35s
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mysql,prod}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-assetdashboard}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_PRICE_EXTERNAL_ENABLED: ${APP_PRICE_EXTERNAL_ENABLED:-true}
      APP_CONNECTIONS_ENABLED: ${APP_CONNECTIONS_ENABLED:-false}
      APP_CONNECTIONS_ENCRYPTION_KEY: ${APP_CONNECTIONS_ENCRYPTION_KEY:-}
      APP_CONNECTIONS_SYNC_INTERVAL_SECONDS: ${APP_CONNECTIONS_SYNC_INTERVAL_SECONDS:-300}
      APP_AI_ENABLED: ${APP_AI_ENABLED:-false}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      APP_AI_BASE_URL: ${APP_AI_BASE_URL:-https://integrate.api.nvidia.com/v1}
      APP_AI_MODEL: ${APP_AI_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      # 값을 비워두면(.env에서 설정 안 함) Spring이 APP_AI_ENABLED를 따라간다 — 빈 문자열로 강제 고정하지 않는다.
      APP_NEWS_SUMMARY_ENABLED:
      APP_AI_DAILY_CALL_LIMIT: ${APP_AI_DAILY_CALL_LIMIT:-200}
      APP_AI_DAILY_TOKEN_LIMIT: ${APP_AI_DAILY_TOKEN_LIMIT:-200000}
      APP_RETENTION_AUDIT_LOG_DAYS: ${APP_RETENTION_AUDIT_LOG_DAYS:-365}
      APP_RETENTION_AGENT_TRACE_DAYS: ${APP_RETENTION_AGENT_TRACE_DAYS:-30}
      APP_RETENTION_EVALUATION_BATCH_DAYS: ${APP_RETENTION_EVALUATION_BATCH_DAYS:-90}
      APP_RESILIENCE_YAHOO_MAX_ATTEMPTS: ${APP_RESILIENCE_YAHOO_MAX_ATTEMPTS:-2}
      APP_RESILIENCE_BINANCE_MAX_ATTEMPTS: ${APP_RESILIENCE_BINANCE_MAX_ATTEMPTS:-2}
      APP_RESILIENCE_UPBIT_MAX_ATTEMPTS: ${APP_RESILIENCE_UPBIT_MAX_ATTEMPTS:-2}
      APP_RESILIENCE_GITHUB_MAX_ATTEMPTS: ${APP_RESILIENCE_GITHUB_MAX_ATTEMPTS:-3}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  mysql-data:
