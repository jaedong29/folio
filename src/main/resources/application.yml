spring:
  application:
    name: asset-dashboard
  lifecycle:
    # SIGTERM을 받으면 진행 중인 요청을 기다리되, 배포가 무한정 멈추지 않도록 상한을 둔다.
    timeout-per-shutdown-phase: 30s
  profiles:
    default: local
  jackson:
    default-property-inclusion: always
    deserialization:
      # 손으로 입력하는 MVP API에서 필드 오타가 조용히 무시되어 0/null로 저장되는 일을 막는다.
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
    generator:
      # DECIMAL(20,8) 값이 "0E-8" 같은 지수 표기로 나가면 프론트에서 그대로 표시된다.
      write-bigdecimal-as-plain: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # 데모용 기본값. 운영에서는 APP_JWT_SECRET 환경변수로 주입한다.
    secret: ${APP_JWT_SECRET:asset-dashboard-local-development-secret-key-must-be-at-least-32-bytes}
    # Access Token은 탈취돼도 피해가 작도록 짧게 유지한다. 세션 연장은 revoke·rotate 가능한 Refresh Token이 담당한다.
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:30}
    refresh-expiration-days: ${APP_JWT_REFRESH_EXPIRATION_DAYS:14}
  auth:
    # brute force 방어. 단일 인스턴스 메모리 상태이며 인스턴스를 늘리면 공유 저장소로 옮겨야 한다.
    max-login-attempts: ${APP_AUTH_MAX_LOGIN_ATTEMPTS:5}
    login-lockout-minutes: ${APP_AUTH_LOGIN_LOCKOUT_MINUTES:15}
    max-requests-per-ip-per-window: ${APP_AUTH_MAX_REQUESTS_PER_IP:20}
    ip-window-seconds: ${APP_AUTH_IP_WINDOW_SECONDS:60}
  price:
    cache-ttl-minutes: 15
    timeout-millis: 2000
    # false 로 두면 모든 외부 시세 호출을 즉시 실패시킨다 (PRD 8-3 시나리오 8 검증용).
    external-enabled: ${APP_PRICE_EXTERNAL_ENABLED:true}
  evidence:
    # 금융 공시 원문으로 검증할 수 있는 규제기관·거래소 도메인. 기업 IR은 별도 검증 정책을 추가한 뒤 확장한다.
    official-domains:
      - dart.fss.or.kr
      - opendart.fss.or.kr
      - englishdart.fss.or.kr
      - kind.krx.co.kr
      - sec.gov
  news:
    # 사용자 수와 무관하게 공용 캐시를 갱신한다. false면 저장된 뉴스 조회만 가능하다.
    external-enabled: ${APP_NEWS_EXTERNAL_ENABLED:true}
    connect-timeout-millis: ${APP_NEWS_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${APP_NEWS_READ_TIMEOUT_MILLIS:5000}
    refresh-cooldown-minutes: ${APP_NEWS_REFRESH_COOLDOWN_MINUTES:360}
    max-items-per-source: ${APP_NEWS_MAX_ITEMS_PER_SOURCE:10}
    worker-delay-millis: ${APP_NEWS_WORKER_DELAY_MILLIS:1000}
    # Agent가 켜지면 함께 활성화하되 APP_NEWS_SUMMARY_ENABLED=false로 비용을 따로 차단할 수 있다.
    summary-enabled: ${APP_NEWS_SUMMARY_ENABLED:${APP_AI_ENABLED:false}}
    summary-worker-delay-millis: ${APP_NEWS_SUMMARY_WORKER_DELAY_MILLIS:1200}
    summary-max-content-chars: ${APP_NEWS_SUMMARY_MAX_CONTENT_CHARS:6000}
  ai:
    # 실제 외부 전송은 명시적으로 켠 경우에만 허용한다. API 키는 파일에 저장하지 않는다.
    enabled: ${APP_AI_ENABLED:false}
    base-url: ${APP_AI_BASE_URL:https://integrate.api.nvidia.com/v1}
    api-key: ${NVIDIA_API_KEY:}
    model: ${APP_AI_MODEL:nvidia/nemotron-3.5-lightning-30b-a3b}
    connect-timeout-millis: ${APP_AI_CONNECT_TIMEOUT_MILLIS:5000}
    read-timeout-millis: ${APP_AI_READ_TIMEOUT_MILLIS:45000}
    # 일반 화면은 결정적 Router로 한 번만 호출하고, true 또는 평가 API에서는 모델 Tool 선택도 검증한다.
    strict-tool-selection: ${APP_AI_STRICT_TOOL_SELECTION:false}
    # Agent와 News 요약이 하루 단위로 공유하는 NIM 호출·토큰 예산. 0 이하면 해당 항목은 무제한이다.
    daily-call-limit: ${APP_AI_DAILY_CALL_LIMIT:200}
    daily-token-limit: ${APP_AI_DAILY_TOKEN_LIMIT:200000}

logging:
  level:
    com.assetdashboard: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:assetdashboard;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
  jpa:
    # Hibernate 가 스키마를 만든 뒤에 seed.sql 이 실행되도록 초기화를 지연시킨다.
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always
      data-locations: classpath:db/seed.sql

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:assetdashboard}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:asset}
    password: ${DB_PASSWORD:assetpw}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

app:
  jwt:
    # 운영에서는 반드시 외부 환경변수로 주입한다. 값이 없으면 애플리케이션이 기동되지 않는다.
    secret: ${APP_JWT_SECRET:}
